<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inhaler</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .detail-header {
            border-bottom: 1px dashed var(--parchment-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .detail-section {
            margin-bottom: 30px;
        }
        .detail-section h2 {
            font-size: 1.25rem;
            color: var(--copper-accent);
            border-bottom: 1px solid var(--parchment-border);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .wip-notice {
            font-family: var(--font-title);
            color: var(--ink-muted);
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="book-layout">
        
        <!-- Sidebar dynamically injected here from assets/js/sidebar.js -->
        <div id="sidebar-container"></div>

        <!-- Main Document Sheet Container -->
        <main class="project-detail-container">
            <article class="parchment-sheet">
                <header class="detail-header">
                    <span class="catalog-num">REF-006</span>
                    <h1>Smart Inhaler</h1>
                    <div class="tag-row">
                        <span class="tag">EMBEDDED SYSTEMS</span>
                        <span class="tag">PCB DESIGN</span>
                        <span class="tag">MECHANICAL DESIGN</span>
                    </div>
                </header>

                <!-- Project Body / WIP Content -->
                <section class="detail-section">
                    <h2>1. Overview & Objectives</h2>
                    <p class="wip-notice">[ Work In Progress - Full project documentation coming soon. ]</p>
                </section>

                <!-- Bottom Exit Navigation -->
                <div style="margin-top: 40px; border-top: 1px dashed var(--parchment-border); padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <a href="../index.html" class="btn-back" style="font-family: var(--font-title); color: var(--copper-accent); text-decoration: none; font-weight: bold; border: 1px dashed var(--copper-accent); padding: 8px 14px; border-radius: 2px; background: rgba(150, 93, 37, 0.05);">&larr; Return Home - View Other Projects</a>
                </div>
            </article>
        </main>
    </div>

    <!-- Centralized Sidebar Injection Script -->
    <script src="../assets/js/sidebar.js"></script>
</body>
</html>
